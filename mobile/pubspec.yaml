name: smart_farmer_mobile
description: "Smart Farmer AI Platform — farmer mobile app (foundation build)."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2 # secure on-device token storage (Keychain/Keystore-backed)
  provider: ^6.1.2 # simple, standard app-state management for auth state
  image_picker: ^1.1.2 # camera + gallery access, free/MIT-style license
  http_parser: ^4.0.2 # MediaType for multipart upload content-type - direct dep, not just transitive via http
  connectivity_plus: ^6.0.5 # real network-status detection for the offline-upload queue
  path_provider: ^2.1.4 # app-local persistent storage directory for the offline upload queue - free, MIT-style license, no new native permissions
  flutter_tts: ^4.2.0 # device-native text-to-speech (Android TextToSpeech / iOS AVSpeechSynthesizer) - free, local, zero cost, no cloud dependency. License could not be independently re-verified via a live pub.dev lookup in this sandbox (pub.dev is not on the network allowlist here - same limitation already disclosed for path_provider in Step 10); it is a long-established, widely-used Flutter community package under a permissive license per training-data knowledge, not independently confirmed live this session.
  geolocator: ^13.0.2 # device GPS position for "Use current location" on Add Farm - free, local, no paid map SDK. MIT license verified live this session (Pub/Cache LICENSE file), unlike flutter_tts/path_provider's assumed licenses above - see docs/LICENSE_REGISTER.md. Reverse-geocoding the captured coordinates to state/district text uses the free public OpenStreetMap Nominatim API directly over `http` (no separate geocoding package) - farmer GPS coordinates are sent to that third-party service only when the farmer explicitly taps "Use current location", never automatically.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  connectivity_plus_platform_interface: ^2.1.0 # fakes real device connectivity in login_screen_test.dart (SyncCoordinator's offline path) - direct dep since it's imported directly by a test, not just transitively via connectivity_plus
  path_provider_platform_interface: ^2.1.3 # fakes app-documents-directory lookup in pending_uploads_screen_test.dart - the real path_provider_windows plugin call hangs indefinitely under a `testWidgets` pump in this environment (unlike a plain `test()` body, which never registers real desktop plugins - see pending_upload_queue_test.dart's comment), so any widget test that touches PendingUploadQueue's real persistence path needs this fake instead

flutter:
  uses-material-design: true
  generate: true # enables flutter gen-l10n from lib/l10n/*.arb
