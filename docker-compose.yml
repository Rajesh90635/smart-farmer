version: "3.9"

# Local, zero-cost development environment. No paid services anywhere in
# this file. Secrets come from the .env file (see .env.example) - never
# hard-coded here, per rule #9.

services:
  postgres:
    image: postgres:16
    container_name: smart-farmer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: smart-farmer-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build: ./backend
    container_name: smart-farmer-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - storage-data:/app/storage-data
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build: ./ai
    container_name: smart-farmer-ai
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
    ports:
      - "8100:8100"
    volumes:
      - ./ai:/app

volumes:
  postgres-data:
  storage-data:
